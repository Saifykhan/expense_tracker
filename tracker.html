<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 0.95em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            padding: 8px 12px;
            width: auto;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .category-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .category-amount {
            font-size: 0.9em;
            color: #666;
        }

        .category-budget {
            font-size: 0.85em;
            color: #667eea;
            font-weight: 600;
        }

        .expense-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .expense-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .expense-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .expense-details {
            flex: 1;
        }

        .expense-date {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
        }

        .expense-description {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .expense-category {
            font-size: 0.9em;
            color: #667eea;
            display: inline-block;
            background: #e9ecff;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .expense-amount {
            font-size: 1.2em;
            font-weight: 700;
            color: #dc3545;
            text-align: right;
            margin-right: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .summary-table th,
        .summary-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .summary-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .summary-table tr:hover {
            background: #f8f9fa;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }

        .status-over {
            color: #dc3545;
            font-weight: 600;
        }

        .status-ok {
            color: #28a745;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Expense Tracker</h1>
            <p>Manage your expenses efficiently</p>
        </div>

        <div class="alert" id="alert"></div>

        <div class="content">
            <!-- Add Category Section -->
            <div class="card">
                <h2>Add Category</h2>
                <div class="form-group">
                    <label for="categoryName">Category Name</label>
                    <input type="text" id="categoryName" placeholder="e.g., Food, Transport">
                </div>
                <div class="form-group">
                    <label for="categoryBudget">Budget Amount</label>
                    <input type="number" id="categoryBudget" placeholder="e.g., 5000" min="0" step="0.01">
                </div>
                <button class="btn btn-success" onclick="addCategory()">Add Category</button>
                
                <h2 style="margin-top: 30px;">Categories</h2>
                <div class="categories-grid" id="categoriesContainer">
                    <div class="no-data">No categories yet</div>
                </div>
            </div>

            <!-- Add Expense Section -->
            <div class="card">
                <h2>Add Expense</h2>
                <div class="form-group">
                    <label for="expenseCategory">Select Category</label>
                    <select id="expenseCategory">
                        <option value="">Choose a category...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expenseAmount">Amount</label>
                    <input type="number" id="expenseAmount" placeholder="e.g., 100" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="expenseDate">Date</label>
                    <input type="date" id="expenseDate">
                </div>
                <div class="form-group">
                    <label for="expenseDescription">Description</label>
                    <textarea id="expenseDescription" placeholder="e.g., Lunch at cafe"></textarea>
                </div>
                <button class="btn btn-success" onclick="addExpense()">Add Expense</button>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats" id="statsContainer"></div>

        <!-- Tabs for Expenses and Reports -->
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('expenses')">Recent Expenses</button>
                <button class="tab-btn" onclick="switchTab('report')">Reports</button>
                <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
            </div>

            <!-- Expenses Tab -->
            <div id="expenses" class="tab-content active">
                <div class="expense-list" id="expensesList">
                    <div class="no-data">No expenses yet</div>
                </div>
            </div>

            <!-- Reports Tab -->
            <div id="report" class="tab-content">
                <h2>Category Report</h2>
                <table class="summary-table" id="reportTable">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Budget</th>
                            <th>Spent</th>
                            <th>Remaining</th>
                            <th>Status</th>
                            <th>Progress</th>
                        </tr>
                    </thead>
                    <tbody id="reportBody">
                        <tr><td colspan="6" class="no-data">No data available</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Settings Tab -->
            <div id="settings" class="tab-content">
                <h2>Settings</h2>
                <div class="form-group">
                    <label>Data Management</label>
                    <button class="btn btn-secondary" onclick="exportData()">📥 Export Data (JSON)</button>
                    <button class="btn btn-secondary" style="margin-top: 10px;" onclick="document.getElementById('importFile').click()">📤 Import Data</button>
                    <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData()">
                    <button class="btn btn-danger" style="margin-top: 10px;" onclick="clearAllData()">🗑️ Clear All Data</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('expenseDate').value = today;

        // Load data from localStorage
        function loadData() {
            const categories = JSON.parse(localStorage.getItem('categories')) || [];
            const expenses = JSON.parse(localStorage.getItem('expenses')) || [];
            return { categories, expenses };
        }

        // Save data to localStorage
        function saveData(data) {
            localStorage.setItem('categories', JSON.stringify(data.categories));
            localStorage.setItem('expenses', JSON.stringify(data.expenses));
            updateUI();
        }

        // Show alert
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }

        // Add Category
        function addCategory() {
            const name = document.getElementById('categoryName').value.trim();
            const budget = parseFloat(document.getElementById('categoryBudget').value);

            if (!name) {
                showAlert('Please enter category name', 'error');
                return;
            }

            if (isNaN(budget) || budget < 0) {
                showAlert('Please enter valid budget amount', 'error');
                return;
            }

            const data = loadData();
            
            if (data.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                showAlert('Category already exists', 'error');
                return;
            }

            data.categories.push({
                id: Date.now(),
                name,
                budget
            });

            saveData(data);
            document.getElementById('categoryName').value = '';
            document.getElementById('categoryBudget').value = '';
            showAlert('Category added successfully');
        }

        // Add Expense
        function addExpense() {
            const categoryId = document.getElementById('expenseCategory').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const date = document.getElementById('expenseDate').value;
            const description = document.getElementById('expenseDescription').value.trim();

            if (!categoryId) {
                showAlert('Please select a category', 'error');
                return;
            }

            if (isNaN(amount) || amount <= 0) {
                showAlert('Please enter valid amount', 'error');
                return;
            }

            if (!date) {
                showAlert('Please select date', 'error');
                return;
            }

            if (!description) {
                showAlert('Please enter description', 'error');
                return;
            }

            const data = loadData();
            const category = data.categories.find(c => c.id == categoryId);

            if (!category) {
                showAlert('Category not found', 'error');
                return;
            }

            data.expenses.push({
                id: Date.now(),
                categoryId: parseInt(categoryId),
                amount,
                date,
                description
            });

            saveData(data);
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseDescription').value = '';
            document.getElementById('expenseDate').value = today;
            showAlert('Expense added successfully');
        }

        // Delete Expense
        function deleteExpense(id) {
            if (confirm('Are you sure you want to delete this expense?')) {
                const data = loadData();
                data.expenses = data.expenses.filter(e => e.id !== id);
                saveData(data);
                showAlert('Expense deleted');
            }
        }

        // Delete Category
        function deleteCategory(id) {
            if (confirm('Delete this category? Related expenses will be deleted too.')) {
                const data = loadData();
                data.categories = data.categories.filter(c => c.id !== id);
                data.expenses = data.expenses.filter(e => e.categoryId !== id);
                saveData(data);
                showAlert('Category deleted');
            }
        }

        // Update UI
        function updateUI() {
            const data = loadData();
            updateCategories(data);
            updateExpenses(data);
            updateCategorySelect(data);
            updateStats(data);
            updateReport(data);
        }

        // Update Categories Display
        function updateCategories(data) {
            const container = document.getElementById('categoriesContainer');
            
            if (data.categories.length === 0) {
                container.innerHTML = '<div class="no-data">No categories yet</div>';
                return;
            }

            container.innerHTML = data.categories.map(cat => {
                const spent = data.expenses
                    .filter(e => e.categoryId === cat.id)
                    .reduce((sum, e) => sum + e.amount, 0);
                
                const remaining = cat.budget - spent;
                const percentage = cat.budget > 0 ? (spent / cat.budget) * 100 : 0;

                return `
                    <div class="category-item">
                        <div class="category-info">
                            <div class="category-name">${cat.name}</div>
                            <div class="category-amount">Spent: ₹${spent.toFixed(2)}</div>
                            <div class="category-budget">Budget: ₹${cat.budget.toFixed(2)}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%"></div>
                            </div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteCategory(${cat.id})">✕</button>
                    </div>
                `;
            }).join('');
        }

        // Update Expenses Display
        function updateExpenses(data) {
            const container = document.getElementById('expensesList');
            
            if (data.expenses.length === 0) {
                container.innerHTML = '<div class="no-data">No expenses yet</div>';
                return;
            }

            const sorted = [...data.expenses].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            container.innerHTML = sorted.slice(0, 20).map(exp => {
                const category = data.categories.find(c => c.id === exp.categoryId);
                const categoryName = category ? category.name : 'Unknown';
                
                return `
                    <div class="expense-item">
                        <div class="expense-details">
                            <div class="expense-date">${new Date(exp.date).toLocaleDateString()}</div>
                            <div class="expense-description">${exp.description}</div>
                            <span class="expense-category">${categoryName}</span>
                        </div>
                        <div class="expense-amount">₹${exp.amount.toFixed(2)}</div>
                        <button class="btn btn-danger" onclick="deleteExpense(${exp.id})" style="width: 40px; padding: 8px;">×</button>
                    </div>
                `;
            }).join('');
        }

        // Update Category Select
        function updateCategorySelect(data) {
            const select = document.getElementById('expenseCategory');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">Choose a category...</option>' + 
                data.categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
            
            select.value = currentValue;
        }

        // Update Statistics
        function updateStats(data) {
            const container = document.getElementById('statsContainer');
            
            const totalBudget = data.categories.reduce((sum, c) => sum + c.budget, 0);
            const totalSpent = data.expenses.reduce((sum, e) => sum + e.amount, 0);
            const totalRemaining = totalBudget - totalSpent;
            const expenseCount = data.expenses.length;

            container.innerHTML = `
                <div class="stat-box">
                    <div class="stat-label">Total Budget</div>
                    <div class="stat-value">₹${totalBudget.toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Spent</div>
                    <div class="stat-value">₹${totalSpent.toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Remaining</div>
                    <div class="stat-value">₹${Math.max(0, totalRemaining).toFixed(2)}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Expenses</div>
                    <div class="stat-value">${expenseCount}</div>
                </div>
            `;
        }

        // Update Report
        function updateReport(data) {
            const tbody = document.getElementById('reportBody');
            
            if (data.categories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No categories yet</td></tr>';
                return;
            }

            tbody.innerHTML = data.categories.map(cat => {
                const spent = data.expenses
                    .filter(e => e.categoryId === cat.id)
                    .reduce((sum, e) => sum + e.amount, 0);
                
                const remaining = cat.budget - spent;
                const percentage = cat.budget > 0 ? (spent / cat.budget) * 100 : 0;
                const status = spent > cat.budget ? '<span class="status-over">OVER BUDGET</span>' : '<span class="status-ok">OK</span>';

                return `
                    <tr>
                        <td><strong>${cat.name}</strong></td>
                        <td>₹${cat.budget.toFixed(2)}</td>
                        <td>₹${spent.toFixed(2)}</td>
                        <td>₹${remaining.toFixed(2)}</td>
                        <td>${status}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${Math.min(percentage, 100)}%; background: ${percentage > 100 ? '#dc3545' : '#28a745'}"></div>
                            </div>
                            ${percentage.toFixed(1)}%
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Switch Tab
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Export Data
        function exportData() {
            const data = loadData();
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `expense_tracker_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showAlert('Data exported successfully');
        }

        // Import Data
        function importData() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.categories && data.expenses) {
                        localStorage.setItem('categories', JSON.stringify(data.categories));
                        localStorage.setItem('expenses', JSON.stringify(data.expenses));
                        updateUI();
                        showAlert('Data imported successfully');
                    } else {
                        showAlert('Invalid file format', 'error');
                    }
                } catch (error) {
                    showAlert('Error importing file', 'error');
                }
            };
            reader.readAsText(file);
            document.getElementById('importFile').value = '';
        }

        // Clear All Data
        function clearAllData() {
            if (confirm('Are you sure? This will delete ALL data permanently!')) {
                localStorage.clear();
                updateUI();
                showAlert('All data cleared');
            }
        }

        // Initial load
        updateUI();
    </script>
</body>
</html>
